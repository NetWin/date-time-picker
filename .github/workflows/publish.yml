name: Publish Package
on:
  push:
    branches:
      - master
      - release/*

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for npm provenance

env:
  HUSKY: 0 # disable Husky hooks during CI

jobs:
  Publish:
    timeout-minutes: 60

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Run Linter
        run: pnpm lint

      - name: Run Tests
        run: pnpm test:ci

      - name: Build library
        run: pnpm build

      # Trusted publishing needs npm >= 11.5.1, the Node runtime installed by pnpm ships without npm
      - name: Install npm
        run: pnpm add --global npm@^11 && npm --version

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
