name: Run tests

on:
  push:
    branches:
      - '**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Run linter
        run: pnpm lint

      - name: Build picker
        run: pnpm build

      - name: Run tests
        run: pnpm test:ci
