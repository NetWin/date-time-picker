allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lightningcss-cli: true
  lmdb: true
  msgpackr-extract: true

# Only allow packages that have been released for at least 7 days (10080 minutes)
minimumReleaseAge: 10080

trustLockfile: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js@0.7.41
  - mermaid@10.9.5
  - chokidar@4.0.3
  - semver@6.3.1 || 5.7.2
